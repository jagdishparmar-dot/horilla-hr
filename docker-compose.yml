# Development Compose stack for Horilla HR.
# Zero-config: `make dev` / `docker compose up --build`
# Production: `make prod` (uses docker-compose.prod.yml + .env — see .env.dist)
#
# Dev secrets below are intentionally weak and for local use only.
# Replaces the legacy docker-compose.yaml (Python 3.10 / runserver) stack.
#
# DATABASE_URL is the control database only. Web and scheduler share one
# anchor below. Tenant connection strings are stored on Tenant rows, not here.

services:
  web:
    # Shared tag so web + scheduler build once and reuse the same image.
    image: horilla-hr:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # If apt hangs on deb.debian.org, set APT_MIRROR=mirrors.aliyun.com
        APT_MIRROR: ${APT_MIRROR:-}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
      - media:/app/media
      # Backup spool, and the system of record when BACKUP_S3_BUCKET is unset.
      - backups:/app/backups
    environment:
      - DEBUG=1
      - DB_HOST=db
    # Believe X-Forwarded-For only from the nginx service (horilla/client_ip.py)
      - HORILLA_TRUSTED_PROXIES=nginx
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - CSRF_TRUSTED_ORIGINS=http://localhost:8000
      - &control_database_url DATABASE_URL=postgres://horilla_user:horilla_pass@db:5432/horilla_db
      - DB_INIT_PASSWORD=dev-init-password-change-in-production
      - REDIS_URL=redis://:horilla_pass@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 30s
      # First boot applies every migration and collectstatic before gunicorn
      # binds (about 5 minutes on an empty database). nginx waits for this
      # check, so a shorter window makes a fresh `make prod` abort as unhealthy.
      start_period: 10m
      retries: 3

  # Background jobs run here, NOT in the web workers. Keep this at exactly one
  # replica: the jobs are not idempotent, so a second copy means a second
  # payslip run and a second backup. Scaling this service is not safe.
  # migrate and migrate_tenants run only from the web entrypoint. A second
  # container that also runs those release tasks will deadlock on DDL.
  # Extra web replicas must set HORILLA_SKIP_RELEASE_TASKS=1.
  # Tenant provisioning runs in the provisioner service below, not here.
  scheduler:
    image: horilla-hr:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    command: python manage.py run_scheduler
    volumes:
      - .:/app
      - media:/app/media
      - backups:/app/backups
    environment:
      - DEBUG=1
      - DB_HOST=db
      # Believe X-Forwarded-For only from the nginx service (horilla/client_ip.py)
      - HORILLA_TRUSTED_PROXIES=nginx
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - *control_database_url
      - DB_INIT_PASSWORD=dev-init-password-change-in-production
      - REDIS_URL=redis://:horilla_pass@redis:6379/0
      # web owns migrate/collectstatic; racing them from here can deadlock on
      # DDL and would wipe STATIC_ROOT while web is serving from it.
      - HORILLA_SKIP_RELEASE_TASKS=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Healthy web means control migrate and migrate_tenants have finished.
      web:
        condition: service_healthy
    # The image's HEALTHCHECK curls localhost:8000/health/, which only the web
    # service serves. This container runs run_scheduler and binds no port, so
    # the inherited check can never pass -- it reported "unhealthy" forever,
    # and orchestrators that gate on health would restart-loop it. The prod
    # overlay builds on this file, so disabling it here covers both stacks.
    healthcheck:
      disable: true
    restart: unless-stopped

  # Tenant create, migrate, backup, restore, suspend, resume, and delete.
  # Exactly one replica. A second copy can claim the same create. On startup
  # a job left running is queued again and continues from completed_steps.
  provisioner:
    image: horilla-hr:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    command: python manage.py run_provisioner
    stop_grace_period: 120s
    volumes:
      - .:/app
      - media:/app/media
      # Dumps are written here, then uploaded to the BACKUP_S3_* store and
      # removed. Without BACKUP_S3_BUCKET this volume holds the dumps.
      - backups:/app/backups
    environment:
      - DEBUG=1
      - DB_HOST=db
      - HORILLA_TRUSTED_PROXIES=nginx
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - *control_database_url
      - DB_INIT_PASSWORD=dev-init-password-change-in-production
      - REDIS_URL=redis://:horilla_pass@redis:6379/0
      - HORILLA_SKIP_RELEASE_TASKS=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  # Connection budget (database-per-tenant): tenant connections use
  # CONN_MAX_AGE=0 so a worker does not keep one connection per customer.
  # Leave Postgres max_connections at the image default until about 30
  # active tenants. PgBouncer is a later addition, not part of the first
  # cutover. Web may scale; scheduler stays at one replica (see above).
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: horilla_db
      POSTGRES_USER: horilla_user
      POSTGRES_PASSWORD: horilla_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Applied only when the data volume is first created. The control login
      # (POSTGRES_USER) may CREATE DATABASE and CREATE ROLE. Tenant queries
      # connect as tenant_<slug>, never as this login.
      - ./docker/postgres/init-control.sql:/docker-entrypoint-initdb.d/10-control.sql:ro
    # Probe the control database named by POSTGRES_DB. Tenant databases are
    # not part of this check.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass horilla_pass
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "horilla_pass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    environment:
      HORILLA_PLATFORM_DOMAIN: ${HORILLA_PLATFORM_DOMAIN:-localhost}
    # Only that variable is substituted. nginx's own $host and $scheme stay.
    command:
      - /bin/sh
      - -c
      - "envsubst '$$HORILLA_PLATFORM_DOMAIN' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"
    volumes:
      # Static only — /media/ is proxied to Django (protected_media). Do not
      # mount the media volume here; an alias location would bypass auth.
      - staticfiles:/static:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf.template:ro
    depends_on:
      web:
        condition: service_healthy
    profiles: ["production"]

  # Local S3-compatible store for exercising the backup path in development
  # (RustFS — drop-in S3 API, no MinIO required):
  #   docker compose --profile backups-s3 up -d
  # then point the app services at it (docker-compose.override.yml):
  #   BACKUP_S3_BUCKET=horilla-backups
  #   BACKUP_S3_ENDPOINT_URL=http://rustfs:9000
  #   BACKUP_S3_ACCESS_KEY=horilla-backup
  #   BACKUP_S3_SECRET_KEY=dev-backup-secret-change-in-production
  # Console at http://localhost:9001 (same credentials).
  rustfs:
    image: rustfs/rustfs:1.0.4
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: horilla-backup
      RUSTFS_SECRET_KEY: dev-backup-secret-change-in-production
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: ""
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    profiles: ["backups-s3"]

  # One-shot: creates the horilla-backups bucket via boto3, then exits.
  # Reuses the app image so we do not pull a second S3 client image.
  # pip install covers images built before boto3 was added to requirements.txt.
  rustfs-init:
    image: horilla-hr:local
    entrypoint:
      - /bin/sh
      - -c
      - |
        pip install -q boto3==1.40.0 &&
        python - <<'PY'
        import time
        import boto3
        from botocore.client import Config
        from botocore.exceptions import ClientError
        client = boto3.client(
            "s3",
            endpoint_url="http://rustfs:9000",
            aws_access_key_id="horilla-backup",
            aws_secret_access_key="dev-backup-secret-change-in-production",
            region_name="auto",
            config=Config(s3={"addressing_style": "path"}),
        )
        for attempt in range(30):
            try:
                client.head_bucket(Bucket="horilla-backups")
                print("bucket ready")
                break
            except ClientError as exc:
                code = int(exc.response.get("ResponseMetadata", {}).get("HTTPStatusCode") or 0)
                err = (exc.response.get("Error") or {}).get("Code", "")
                if code in (301, 403) or err in ("301", "403", "BucketAlreadyOwnedByYou", "BucketAlreadyExists"):
                    print("bucket ready")
                    break
                if code == 404 or err in ("404", "NoSuchBucket", "NotFound"):
                    try:
                        client.create_bucket(Bucket="horilla-backups")
                        print("bucket created")
                        break
                    except ClientError as create_exc:
                        create_err = (create_exc.response.get("Error") or {}).get("Code", "")
                        if create_err in ("BucketAlreadyOwnedByYou", "BucketAlreadyExists"):
                            print("bucket ready")
                            break
                        raise
                if attempt == 29:
                    raise
                time.sleep(1)
        PY
    depends_on:
      rustfs:
        condition: service_healthy
    profiles: ["backups-s3"]

volumes:
  staticfiles:
  media:
  postgres_data:
  redis_data:
  backups:
  rustfs_data:
