{% load static i18n i18n horillafilters %}
<button type="button" class="oh-header__profile-trigger" aria-label="{% trans 'Profile menu' %}">
    <div class="relative flex items-center cursor-pointer w-max">
        <img
            src="{{request.user.employee_get.get_avatar}}"
            alt="{% trans 'user' %}"
            class="oh-header__avatar"
            loading="lazy"
        >
        {# check_online comes from check-in records: switched off, it is offline for everyone #}
        {% if request|is_check_in_enabled %}
            <span
                class="
                    absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full border-2 border-white
                    {% if user.employee_get.check_online %} bg-[#1dd75b] {% else %} bg-[red] {% endif %}
                "
            ></span>
        {% endif %}
    </div>
    <div class="oh-header__profile-meta hidden md:block text-left">
        <h5>{{ user.employee_get.get_full_name|title }}</h5>
        {% if request|is_check_in_enabled %}
            <p>
                {% if user.employee_get.check_online %}
                    {% trans "Online" %}
                {% else %}
                    {% trans "Offline" %}
                {% endif %}
            </p>
        {% endif %}
    </div>
    <div class="hidden md:flex items-center pr-1">
        <img
            src="/static/horilla_theme/assets/img/icons/downarrow.svg"
            alt=""
            class="oh-header__caret downarrow"
        >
    </div>
</button>

<div class="dropdown-content absolute z-10 bg-white rounded-lg [box-shadow:0px_0px_20px_0px_rgb(0_0_0_/_8%)] min-w-[170px] py-2 px-4 right-0">
    <ul>
        {% if request.session.selected_company == "all" or request.user.employee_get.employee_work_info.company_id.id == request.session.selected_company|default:"-1"|add:"0" %}
            <li>
                <button class="py-1.5 hover:text-primary-600 transition duration-300 text-sm gap-4 items-center flex w-full">
                    <a
                        class="text-[13px]"
                        hx-get="{% url 'employee-profile' request.user.employee_get.id %}"
                        hx-target="#ohMainContent"
                        hx-swap="innerHTML show:window:top"
                        hx-push-url="{% url 'employee-profile' %}"
                    >{% trans "My Profile" %}</a>
                </button>
            </li>
            <li>
                <button class="py-1.5 hover:text-primary-600 transition duration-300 text-sm gap-4 items-center flex w-full">
                    <a
                        class="text-[13px]"
                        href="{% url 'change-username' %}"
                        hx-get="{% url 'change-username' %}"
                        hx-target="#ohMainContent"
                        hx-select="#ohMainContent > *"
                        hx-swap="innerHTML show:window:top"
                        hx-push-url="true"
                    >{% trans "Change Username" %}</a>
                </button>
            </li>
            <li>
                <button class="py-1.5 hover:text-primary-600 transition duration-300 text-sm gap-4 items-center flex w-full">
                    <a
                        class="text-[13px]"
                        href="{% url 'change-password' %}"
                        hx-get="{% url 'change-password' %}"
                        hx-target="#ohMainContent"
                        hx-select="#ohMainContent > *"
                        hx-swap="innerHTML show:window:top"
                        hx-push-url="true"
                    >{% trans "Change Password" %}</a>
                </button>
            </li>
        {% endif %}

        <hr class="text-[#1c1c1c] my-2">
        <li>
            <button class="py-1.5 hover:text-primary-600 transition duration-300 text-sm gap-4 items-center flex w-full">
                <a class="text-[13px]" href="{% url 'logout' %}"> {% trans "Logout" %} </a>
            </button>
        </li>
    </ul>
</div>
