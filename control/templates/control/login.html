<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control login</title>
  <style>
    body { margin: 0; font: 16px/1.45 system-ui, sans-serif; background: #f5f5f4; color: #1c1917; }
    main { max-width: 24rem; margin: 4rem auto; background: #fff; padding: 1.5rem; border: 1px solid #e7e5e4; }
    h1 { font-size: 1.3rem; margin-top: 0; }
    label { display: block; margin: 0.8rem 0 0.2rem; }
    input { width: 100%; padding: 0.4rem 0.5rem; box-sizing: border-box; }
    button { margin-top: 1rem; background: #1d4ed8; color: #fff; border: 0; border-radius: 4px; padding: 0.45rem 0.8rem; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <main>
    <h1>Control plane</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="{% url 'control-login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      {{ form.as_p }}
      <button type="submit">Log in</button>
    </form>
  </main>
</body>
</html>
