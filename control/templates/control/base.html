<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Control{% endblock %}</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font: 16px/1.45 system-ui, sans-serif; color: #1c1917; background: #f5f5f4; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.5rem; background: #1c1917; color: #fafaf9; }
    header a { color: #fafaf9; margin-right: 1rem; }
    header form { display: inline; }
    header button { background: transparent; color: #fafaf9; border: 1px solid #78716c; border-radius: 4px; padding: 0.25rem 0.6rem; }
    main { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: 0.5rem 0.7rem; border-bottom: 1px solid #e7e5e4; vertical-align: top; }
    th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; color: #57534e; }
    a.button, button { background: #1d4ed8; color: #fff; border: 0; border-radius: 4px; padding: 0.4rem 0.75rem; text-decoration: none; cursor: pointer; }
    button.danger { background: #b91c1c; }
    button.quiet { background: #44403c; }
    .error { color: #b91c1c; margin: 0 0 1rem; }
    form p { margin: 0 0 0.8rem; }
    label { display: block; font-size: 0.9rem; margin-bottom: 0.2rem; }
    input { width: 100%; max-width: 28rem; padding: 0.4rem 0.5rem; border: 1px solid #d6d3d1; border-radius: 4px; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
    .actions form { margin: 0; }
    .note { color: #57534e; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="{% url 'control-home' %}">Tenants</a>
      {% if operator and operator.is_staff %}
        <a href="{% url 'control-operators' %}">Operators</a>
      {% endif %}
    </nav>
    {% if operator %}
      <form method="post" action="{% url 'control-logout' %}">
        {% csrf_token %}
        <button type="submit">Log out</button>
      </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
