{% comment %}Renders one form field. Pass field=<BoundField>, optionally wide=1 and suffix="text".{% endcomment %}
<div class="field{% if wide %} field--wide{% endif %}{% if field.errors %} field--error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% if suffix %}
    <div class="input-suffix">{{ field }}<span>{{ suffix }}</span></div>
  {% else %}
    {{ field }}
  {% endif %}
  {% if field.help_text %}<span class="field__help">{{ field.help_text }}</span>{% endif %}
  {% for error in field.errors %}<span class="field__error">{{ error }}</span>{% endfor %}
</div>
