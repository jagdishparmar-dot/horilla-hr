      SECURE_SSL_REDIRECT: '${SECURE_SSL_REDIRECT:-false}'
      HORILLA_REQUIRE_SCHEDULER: '${HORILLA_REQUIRE_SCHEDULER:-false}'
      HORILLA_SCHEDULER_HISTORY_DAYS: '${HORILLA_SCHEDULER_HISTORY_DAYS:-7}'
      HORILLA_ALLOW_PYTHON_TAX_FORMULAS: '${HORILLA_ALLOW_PYTHON_TAX_FORMULAS:-false}'
