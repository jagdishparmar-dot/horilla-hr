name: horilla_employee
description: Horilla HR employee mobile app — check-in / check-out.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  hugeicons: 4.4.0
  url_launcher: ^6.3.3
  open_filex: ^5.0.0
  path_provider: ^2.1.6
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#2F6BFF"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#2F6BFF"
  color_dark: "#2F6BFF"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#2F6BFF"
    color_dark: "#2F6BFF"
    image: assets/branding/splash_logo.png
    icon_background_color: "#2F6BFF"
  android: true
  ios: true
  web: false
