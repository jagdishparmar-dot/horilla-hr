name: horilla_employee
description: ClockMe employee attendance app — check-in / check-out.
publish_to: "none"
version: 1.0.3+6

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  hugeicons: 4.4.0
  url_launcher: ^6.3.3
  open_filex: ^5.0.0
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Geist-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/new_app_icon.png
  adaptive_icon_background: "#2F6BFF"
  adaptive_icon_foreground: assets/branding/new_app_icon.png
  adaptive_icon_foreground_inset: 0
  background_color_ios: "#2F6BFF"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#2F6BFF"
  color_dark: "#2F6BFF"
  image: assets/branding/new_app_icon.png
  android_12:
    color: "#2F6BFF"
    color_dark: "#2F6BFF"
    image: assets/branding/new_app_icon.png
    icon_background_color: "#2F6BFF"
    icon_background_color_dark: "#2F6BFF"
  android: true
  ios: true
  web: false
